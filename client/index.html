<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusFlow — Campus Placement Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces (Editorial variable serif: Headings, Page Titles, Hero Numbers) -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&display=swap" rel="stylesheet" />
    <!-- Archivo Black (Geometric display font: Accents, Badges) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" />
    <!-- DM Sans (Bespoke humanist sans: Body text, Controls, Navigation, Data grids) -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap" rel="stylesheet" />
    <!-- JetBrains Mono (Technical monospace: IDs, Timestamps, Codes, Logs) -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Inline anti-flash script for per-user and device theme preferences -->
    <script>
      (function(){
        try {
          var userRaw = localStorage.getItem('campusflow_user');
          var user = userRaw ? JSON.parse(userRaw) : null;
          var key = user && user.id ? ('campusflow_theme_' + user.id) : 'campusflow_theme_device';
          var stored = localStorage.getItem(key) || localStorage.getItem('campusflow_theme_device') || localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e){}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
